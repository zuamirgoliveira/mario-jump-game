<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Meta tags PWA -->
	<meta name="theme-color" content="#87CEEB">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Mario Jump">
	<link rel="apple-touch-icon" href="./images/icon-192.png">
	<link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>

    <title>Mario Jump</title>
</head>
<body>
    <div class="game-board">
        <img src="./images/mario_jump.svg" id="logo-img">
        <div class="score-container">
            <div id="text-score">Score:</div>
            <div id="score">0</div>
			<div id="text-high-score">High Score:</div>
			<div id="high-score">0</div>
        </div>
		<button id="mute-button" class="mute-button">🔊</button>
		
        <div class="start-container">
			<div style="text-align: center;">
				<div id="press-key-message">Press any key to start</div>
			</div>
			<img src="" id="game-over-img">
			<button id="btn-start-game" onclick="startGame()" class="start-button"><img src="./images/icons8-repeat-40.png" class="reload"></button>
		</div>

        <img src="./images/super-mario-bros-cloud-little.png" class="cloud">
        <img src="./images/super-mario-bros-clouds.png" class="clouds">
        <img src="./images/super-mario-bros-clouds_2.png" class="clouds-2">
        <img src="./images/mario-sprint.gif" class="mario">
        <img src="./images/mario-pipe.png" class="pipe">

    </div>
    <div class="grass-container">
		<div class="grass"></div>
	</div>
	<script>
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('./service-worker.js')
					.then(() => console.log('Service Worker registrado!'))
					.catch((err) => console.log('Erro no Service Worker:', err));
			});
		}
	</script>
</body>
<footer style="color: white; text-align: center; margin-top: 10px; font-family: Verdana; font-size: 12px;">
    Fan-made project for educational purposes. Mario is a trademark of Nintendo.
</footer>
</html>
