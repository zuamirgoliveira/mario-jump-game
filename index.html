<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="./css/style.css">
    <title>Mario Jump</title>
</head>
<body>
    <div class="game-board">
        <img src="./images/mario_jump.svg" id="logo-img">
        <div class="score-container">
            <div id="text-score">Score:</div>
            <div id="score">0</div>
        </div>
        
        <div class="start-container">
            <img src="" id="game-over-img">
            <button id="btn-start-game" style="visibility:hidden;">
                <img src="./images/icons8-repeat-40.png" class="reload">
            </button>
        </div>

        <img src="./images/super-mario-bros-cloud-little.png" class="cloud">
        <img src="./images/super-mario-bros-clouds.png" class="clouds">
        <img src="./images/super-mario-bros-clouds_2.png" class="clouds-2">
        <img src="./images/mario-sprint.gif" class="mario">
        <img src="./images/mario-pipe.png" class="pipe">
    </div>
    <div class="grass-container">
        <img src="./images/mario-grass.png" class="grass">
    </div>
    
    <script src="./js/script.js"></script>
</body>
</html>
